{% extends 'base.html' %}
{% block title %}Edit_Task{% endblock %}


{% block content %}

<h1>Edit Task</h1>

{% if task %}
    <form method="post">
        <label>Title</label>
        <input type="text" name="title" value="{{task.title}}" ><br><br>
        <label>Description</label>
        <textarea name = "description">{{task.description}}</textarea><br><br>
        <button type="submit">submit</button>
    </form>
{% endif %}
{% endblock %}
